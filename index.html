<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>不卖水果的水果铺 - 现货风味大清单</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #1a1614;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  /* ---------------- 画布外侧操作面板 (截图绝不包含) ---------------- */
  .control-panel {
    width: 480px;
    background: #2b221c;
    border: 3px solid #3d2314;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 800;
    color: #e9c46a;
  }
  .btn-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .action-btn {
    font-weight: 800;
    font-size: 13px;
    padding: 8px 14px;
    border: 2px solid #3d2314;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 3px 0 #3d2314;
    transition: all 0.1s;
  }
  .action-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #3d2314;
  }
  .btn-export { background: #e76f51; color: #fff; }
  .btn-import { background: #2a9d8f; color: #fff; }
  .btn-toggle { background: #e9c46a; color: #3d2314; }

  /* 批量导入编辑框 */
  .import-box {
    display: none;
    margin-top: 10px;
    background: #1e1713;
    padding: 10px;
    border-radius: 8px;
    border: 1.5px dashed #4e382b;
  }
  .import-box.active { display: block; }
  .import-textarea {
    width: 100%;
    height: 120px;
    background: #2b221c;
    color: #f7eedd;
    border: 1.5px solid #3d2314;
    border-radius: 6px;
    padding: 8px;
    font-size: 12px;
    line-height: 1.5;
    outline: none;
    resize: vertical;
  }
  .import-tip {
    font-size: 11px;

    margin: 6px 0 8px;
    line-height: 1.4;
  }

  /* 快捷微调抽屉 */
  .quick-edit-box {
    display: none;
    margin-top: 10px;
    max-height: 320px;
    overflow-y: auto;
    padding: 6px;
    background: #1e1713;
    border-radius: 8px;
  }
  .quick-edit-box.active { display: block; }
  .edit-series-card {
    background: #2b221c;
    border: 1.5px solid #3d2314;
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 8px;
  }
  .edit-series-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .edit-title-input {
    background: #1a1614;
    color: #fff;
    border: 1px solid #4e382b;
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 12px;
    font-weight: bold;
    flex: 1;
  }
  .btn-del-series {
    background: #c1121f;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 11px;
    cursor: pointer;
  }
  .edit-chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 6px;
  }
  .edit-chip {
    background: #3d2e24;
    color: #f7eedd;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 12px;
    border: 1px solid #5a4233;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .edit-chip .del-x {
    color: #e76f51;
    cursor: pointer;
    font-weight: bold;
  }
  .add-item-row {
    display: flex;
    gap: 4px;
  }
  .add-item-input {
    flex: 1;
    background: #1a1614;
    color: #fff;
    border: 1px solid #4e382b;
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 11px;
  }
  .btn-add-item {
    background: #2a9d8f;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
  }

  /* ---------------- 9:16 标准海报画布 (1080x1920) ---------------- */
  #poster-canvas {
    width: 480px;
    background-color: #f7eedd;
    border: 8px solid #3d2314;
    border-radius: 18px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .header {
    background: #e76f51;
    border-bottom: 6px solid #3d2314;
    padding: 14px 12px 10px;
    text-align: center;
    position: relative;
  }
  .header-banner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .apple-avatar {
    width: 72px;
    height: 72px;
    background: #f7eedd;
    border: 3.5px solid #3d2314;
    border-radius: 50%;
    box-shadow: 2px 2px 0 #3d2314;
    object-fit: cover;
    display: block;
    flex-shrink: 0;
  }
  .header-titles h1 {
    font-size: 32px;
    color: #fff;
    text-shadow: 3px 3px 0 #3d2314, -2px -2px 0 #3d2314, 2px -2px 0 #3d2314, -2px 2px 0 #3d2314;
    letter-spacing: 2px;
    line-height: 1.1;
  }
  .header-tag {
    display: inline-block;
    background: #e9c46a;
    color: #3d2314;
    font-weight: 800;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 12px;
    border: 2px solid #3d2314;
    margin-top: 4px;
  }
  .shelf-grid {
    padding: 10px 8px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    background: #fbf5ea;
  }
  .model-card {
    background: #ffffff;
    border: 2.5px solid #3d2314;

    flex-direction: column;
  }
  .model-head {
    font-size: 11.5px;

    color: #fff;
    padding: 3px 6px;
    border-radius: 4px;

    text-align: center;

    justify-content: space-between;

  .tag-c1 { background: #2a9d8f; }
  .tag-c2 { background: #e76f51; }
  .tag-c3 { background: #f4a261; }
  .tag-c4 { background: #457b9d; }

  .flavor-box {
    font-size: 10.5px;
    line-height: 1.55;
    color: #2b2b2b;
    font-weight: 600;
    word-break: break-all;
  }
  .flavor-box span {
    display: inline-block;
    white-space: nowrap;
  }
  .flavor-box span::after {
    content: "·";
    color: #b5a499;
    margin: 0 2px;
  }
  .flavor-box span:last-child::after {
    content: "";
  }
  .footer {
    background: #3d2314;
    color: #f4a261;
    padding: 10px 8px;

    font-weight: 800;

  }
</style>

<!-- 操作面板（画布外，截图不包含） -->

</div>

<!-- 9:16 标准海报主体 -->
<div id="poster-canvas">

  </div>

  <div class="shelf-grid" id="shelf-grid"></div>

  <div class="footer">
    <div class="footer-trust">私信发高清实拍细节 📸 ｜ 圈选口味直接配 ｜ 全线现货秒发</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>

  { title: "【外星人】", flavors: ["葡萄", "草莓", "极寒刃", "桃子", "苹果", "薄荷", "宝矿力", "柠檬橙子", "铁观音", "龙井", "西瓜", "菠萝", "番石榴", "荔枝"] },
  { title: "【Y柚 独角兽】", flavors: ["青柑茶", "青提茉莉", "薄荷口香糖", "绿豆", "快乐养乐多", "冰镇西瓜", "灵魂薄荷", "菠萝", "青提", "乌龙茶", "斩铁剑薄荷", "荔枝冰", "茉莉绿茶", "柠檬茶", "葡萄柚", "龙井", "葡萄", "草莓", "鲜橙子汽水", "冰镇椰子汁", "淘气柚子茶", "红酒", "番石榴", "牛奶", "山楂"] },
  { title: "【Z加 冰熊 20000】", flavors: ["西瓜冰", "留兰香薄荷", "草莓芒果", "酸苹果", "青提", "椰子水", "树莓西瓜", "樱桃可乐", "混合浆果"] },
  { title: "【冰熊传奇 6000】", flavors: ["三芒", "青提", "薄荷", "冰爽青柠", "海盐柠檬", "凝霜茶", "葡萄", "百香果", "西柚", "绿豆", "青柑甘露", "老冰棍", "柠檬菠萝", "矿泉水", "草莓奇异果", "芭乐", "零度可乐", "荔枝冰", "龙井", "西瓜冰"] },
  { title: "【REXI ACE】", flavors: ["西瓜茉莉花茶", "烘焙铁观音"] },
  { title: "【REXI 4000】", flavors: ["普洱茶", "可乐", "绿豆", "芒果", "极地茉莉", "香芋", "柠檬红茶", "宝矿力", "山楂", "矿泉水", "奇异果", "葡萄", "龙井", "菠萝", "荔枝", "椰子水", "薄荷", "百香果", "青提", "西瓜", "番石榴", "百香果西柚", "青芒", "铁观音"] },
  { title: "【REXI板砖 20000】", flavors: ["抹茶", "椰子水", "西瓜", "野酸味", "宝矿力", "龙井", "葡萄", "猕猴桃", "铁观音", "青提", "菠萝", "百香果", "薄荷", "茉莉绿茶", "柠檬茶", "绿豆", "香蕉"] },
  { title: "【REXI极凉 12000】", flavors: ["西瓜茉莉", "白桃", "葡萄铁观音", "葡萄冰", "海盐柠檬", "西瓜冰", "极凉薄荷", "铁观音"] },
  { title: "【松 A38】", flavors: ["柠檬可乐", "龙井", "奇异果", "荔枝", "西柚", "白桃乌龙", "蓝莓", "青提", "黑加仑", "杨梅", "菠萝", "芭乐", "青苹果", "百香果"] },
  { title: "【松 A55】", flavors: ["菠萝", "薄荷", "西柚百香果", "青苹果", "龙井", "椰子", "巨峰葡萄", "青提", "番石榴", "老冰棍", "草莓"] }
];

// 读取本地存储
let currentData = JSON.parse(localStorage.getItem('my_shelf_menu_data')) || defaultData;

function saveData() {
  localStorage.setItem('my_shelf_menu_data', JSON.stringify(currentData));
}

// 渲染海报画布
function renderPoster() {
  const grid = document.getElementById('shelf-grid');
  grid.innerHTML = '';

  currentData.forEach((s, idx) => {
    const card = document.createElement('div');
    card.className = 'model-card';
    const colorClass = tagColors[idx % tagColors.length];
    const spanList = s.flavors.map(name => `<span>${name}</span>`).join('');

    card.innerHTML = `
      <div class="model-head ${colorClass}">
        <span>${s.title}</span>
        <span>${s.flavors.length}款</span>
      </div>
      <div class="flavor-box">
        ${spanList || '<span style="color:#aaa;font-style:italic;">暂无现货</span>'}
      </div>
    `;
    grid.appendChild(card);
  });
}

// 渲染快捷微调面板
function renderQuickEdit() {
  const container = document.getElementById('seriesEditList');
  container.innerHTML = '';

  currentData.forEach((s, sIdx) => {
    const div = document.createElement('div');
    div.className = 'edit-series-card';

    const chips = s.flavors.map((flv, fIdx) => `
      <span class="edit-chip">
        ${flv}
        <span class="del-x" onclick="removeFlavor(${sIdx}, ${fIdx})">✕</span>
      </span>
    `).join('');

    div.innerHTML = `
      <div class="edit-series-head">
        <input type="text" class="edit-title-input" value="${s.title}" onchange="updateSeriesTitle(${sIdx}, this.value)">
        <button class="btn-del-series" onclick="deleteSeries(${sIdx})">删除系列</button>
      </div>
      <div class="edit-chip-list">${chips}</div>
      <div class="add-item-row">
        <input type="text" class="add-item-input" id="add-input-${sIdx}" placeholder="输入新口味回车..." onkeydown="if(event.key==='Enter') addFlavor(${sIdx})">
        <button class="btn-add-item" onclick="addFlavor(${sIdx})">添加</button>
      </div>
    `;
    container.appendChild(div);
  });
}

// 增删口味与系列操作
function removeFlavor(sIdx, fIdx) {
  currentData[sIdx].flavors.splice(fIdx, 1);
  saveData();
  renderPoster();
  renderQuickEdit();
}

function addFlavor(sIdx) {
  const input = document.getElementById(`add-input-${sIdx}`);
  const val = input.value.trim();
  if (!val) return;
  currentData[sIdx].flavors.push(val);
  input.value = '';
  saveData();
  renderPoster();
  renderQuickEdit();
}

function updateSeriesTitle(sIdx, newTitle) {
  currentData[sIdx].title = newTitle.trim();
  saveData();
  renderPoster();
}

function deleteSeries(sIdx) {
  if (confirm(`确定要移除 ${currentData[sIdx].title} 整个系列吗？`)) {
    currentData.splice(sIdx, 1);
    saveData();
    renderPoster();
    renderQuickEdit();
  }
}

function addNewSeries() {
  const title = prompt("请输入新系列名称（例如：【新系列名】）：");
  if (!title) return;
  currentData.push({ title: title.trim(), flavors: [] });
  saveData();
  renderPoster();
  renderQuickEdit();
}

// 展开/收起面板
function toggleImportBox() {
  const el = document.getElementById('importBox');
  el.classList.toggle('active');
  document.getElementById('quickEditBox').classList.remove('active');
}

function toggleQuickEdit() {
  const el = document.getElementById('quickEditBox');
  el.classList.toggle('active');
  document.getElementById('importBox').classList.remove('active');
  if (el.classList.contains('active')) renderQuickEdit();
}

// 选项A：批量文本解析导入
function executeBatchImport() {
  const text = document.getElementById('importText').value.trim();
  if (!text) {
    alert("请先粘贴文本内容！");
    return;
  }

  const lines = text.split('\n');
  const parsed = [];

  lines.forEach(line => {
    line = line.trim();
    if (!line) return;

    // 匹配 【系列名】 以及后面的所有口味
    const match = line.match(/^【(.*?)】\s*(.*)$/);
    if (match) {
      const title = `【${match[1]}】`;
      const flvStr = match[2];
      // 支持以空格、逗号、顿号、点号拆分
      const flvs = flvStr.split(/[\s,，、·]+/).filter(Boolean);
      parsed.push({ title: title, flavors: flvs });
    } else {
      // 兼容没有括号的普通格式（第一词当系列名）
      const parts = line.split(/[\s,，、·]+/).filter(Boolean);
      if (parts.length > 0) {
        parsed.push({ title: `【${parts[0]}】`, flavors: parts.slice(1) });
      }
    }
  });

  if (parsed.length === 0) {
    alert("未识别出有效系列，请检查格式是否如：【系列名】口味1 口味2");
    return;
  }

  currentData = parsed;
  saveData();
  renderPoster();
  renderQuickEdit();
  document.getElementById('importBox').classList.remove('active');
  alert(`成功解析并更新 ${parsed.length} 个系列！`);
}

// 导出当前数据为文本（方便复制到备忘录）
function fillCurrentText() {
  const text = currentData.map(s => `${s.title} ${s.flavors.join(' ')}`).join('\n');
  document.getElementById('importText').value = text;
}

// 高清海报保存（只截画布自身）
function takeSnapshot() {
  const el = document.getElementById('poster-canvas');
  html2canvas(el, { scale: 3, useCORS: true }).then(canvas => {
    const link = document.createElement('a');
    link.download = '水果铺今日风味海报.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

// 启动渲染
renderPoster();
