<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #1a1614;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  
  /* 顶部操作区（完全在海报画布之外，绝不影响海报画面） */
  .btn-bar {
    margin-bottom: 16px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .action-btn {
    font-weight: 800;
    font-size: 15px;
    padding: 10px 20px;
    border: 3px solid #3d2314;
    border-radius: 30px;
    box-shadow: 0 4px 0 #3d2314;
    cursor: pointer;
    transition: all 0.1s;
  }
  .export-btn {
    background: #e76f51;
    color: #fff;
  }
  .manage-btn {
    background: #e9c46a;
    color: #3d2314;
  }
  .action-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #3d2314;
  }

  /* 9:16 标准海报画布 (1080x1920 等比缩小展示) */
  #poster-canvas {
    width: 480px;
    background-color: #f7eedd;
    border: 8px solid #3d2314;
    border-radius: 18px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  /* 顶部美式招牌 */
  .header {
    background: #e76f51;
    border-bottom: 6px solid #3d2314;
    padding: 14px 12px 10px;
    text-align: center;
    position: relative;
  }
  .header-banner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .apple-avatar {
    width: 72px;
    height: 72px;
    background: #f7eedd;
    border: 3.5px solid #3d2314;
    border-radius: 50%;
    box-shadow: 2px 2px 0 #3d2314;
    object-fit: cover;
    display: block;
    flex-shrink: 0;
    cursor: pointer;
  }
  .header-titles h1 {
    font-size: 32px;
    color: #fff;
    text-shadow: 3px 3px 0 #3d2314, -2px -2px 0 #3d2314, 2px -2px 0 #3d2314, -2px 2px 0 #3d2314;
    letter-spacing: 2px;
    line-height: 1.1;
  }
  .header-tag {
    display: inline-block;
    background: #e9c46a;
    color: #3d2314;
    font-weight: 800;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 12px;
    border: 2px solid #3d2314;
    margin-top: 4px;
  }
  /* 核心 14 格独立货架区 (双列瀑布流) */
  .shelf-grid {
    padding: 10px 8px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    background: #fbf5ea;
  }
  .model-card {
    background: #ffffff;
    border: 2.5px solid #3d2314;
    border-radius: 8px;
    box-shadow: 2px 2px 0 #3d2314;
    padding: 6px 7px 8px;
    display: flex;
    flex-direction: column;
  }
  .model-head {
    font-size: 11.5px;
    font-weight: 900;
    color: #fff;
    padding: 3px 6px;
    border-radius: 4px;
    border: 1.5px solid #3d2314;
    text-align: center;
    margin-bottom: 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .tag-c1 { background: #2a9d8f; }
  .tag-c2 { background: #e76f51; }
  .tag-c3 { background: #f4a261; }
  .tag-c4 { background: #457b9d; }
  .tag-c5 { background: #e9c46a; color: #3d2314 !important; }
  .flavor-box {
    font-size: 10.5px;
    line-height: 1.55;
    color: #2b2b2b;
    font-weight: 600;
    word-break: break-all;
  }
  .flavor-box span {
    display: inline-block;
    white-space: nowrap;
  }
  .flavor-box span::after {
    content: "·";
    color: #b5a499;
    margin: 0 2px;
  }
  .flavor-box span:last-child::after {
    content: "";
  }
  /* 底部背书区 */
  .footer {
    background: #3d2314;
    color: #f4a261;
    padding: 10px 8px;
    text-align: center;
    border-top: 4px solid #2a9d8f;
  }
  .footer-trust {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }

  /* ------------------- 管理弹窗层（平时隐藏，不破坏任何布局） ------------------- */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 15px;
  }
  .modal-overlay.active {
    display: flex;
  }
  .modal-content {
    background: #fbf5ea;
    width: 100%;
    max-width: 600px;
    max-height: 85vh;
    border: 4px solid #3d2314;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  }
  .modal-header {
    background: #e76f51;
    color: #fff;
    padding: 12px 16px;

    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #3d2314;

  .close-btn {

    color: #fff;
    border: none;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;

  .modal-body {

    flex: 1;

    background: #fff;
    border: 2px solid #3d2314;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 12px;
  }

    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-weight: 900;
    font-size: 14px;
    color: #3d2314;
    border-bottom: 1.5px dashed #ccc;
    padding-bottom: 4px;
  }
  .chip-container {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;

  .chip {
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 16px;
    border: 1.5px solid #3d2314;
    cursor: pointer;
    user-select: none;
    transition: all 0.1s;
  }

    background: #2a9d8f;
    color: #fff;
  }

  .chip.inactive {
    background: #eee;
    color: #999;
    border-color: #bbb;
    text-decoration: line-through;
  }
  .add-flavor-row {
    display: flex;
    gap: 6px;
  }
  .add-flavor-input {
    flex: 1;
    border: 1.5px solid #3d2314;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;

    background: #3d2314;
    color: #ffd60a;
    border: none;
    padding: 4px 10px;

    font-weight: bold;

  }
  .modal-footer {
    background: #eee;
    border-top: 2px solid #3d2314;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;

      </div>
    </div>
  </div>

  <!-- 14 个货架由 JS 动态渲染 -->
  <div class="shelf-grid" id="shelf-grid"></div>

  <div class="footer">
    <div class="footer-trust">私信发高清实拍细节 📸 ｜ 圈选口味直接配 ｜ 全线现货秒发</div>
  </div>
</div>

<!-- 点选管理弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3>⚙️ 今日现货口味点选（点一下开关）</h3>
      <button class="close-btn" onclick="closeModal()">✕ 完成关闭</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <span style="font-size: 11px; color: #666;">绿色=今日有货 ｜ 灰色带横线=今日缺货</span>
      <button class="action-btn export-btn" style="padding: 6px 14px; font-size: 13px;" onclick="closeModal()">保存并更新海报</button>
    </div>
  </div>
</div>

// 渲染海报画布上的货架

  const grid = document.getElementById('shelf-grid');
  grid.innerHTML = '';

  shelves.forEach((s) => {
    // 找出当前激活（有货）的口味
    const activeFlavors = s.flavors.filter(f => f.active);

    const card = document.createElement('div');
    card.className = 'model-card';

    const spansHtml = activeFlavors.length > 0 
      ? activeFlavors.map(f => `<span>${f.name}</span>`).join('')
      : `<span style="color:#999;font-style:italic;">今日暂无现货</span>`;

    card.innerHTML = `
      <div class="model-head ${s.colorClass}">
        <span>${s.title}</span>
        <span>${activeFlavors.length}款</span>
      </div>
      <div class="flavor-box">
        ${spansHtml}
      </div>
    `;
    grid.appendChild(card);
  });
}

// 渲染管理后台弹窗里的点选药丸
function renderModal() {
  const body = document.getElementById('modalBody');
  body.innerHTML = '';

  shelves.forEach((s, sIdx) => {
    const group = document.createElement('div');
    group.className = 'manage-group';

    const chipsHtml = s.flavors.map((f, fIdx) => `
      <span class="chip ${f.active ? 'active' : 'inactive'}" onclick="toggleFlavor(${sIdx}, ${fIdx})">
        ${f.name}
      </span>
    `).join('');

    group.innerHTML = `
      <div class="manage-group-head">
        <span>${s.title}</span>
        <div>
          <button style="font-size:11px;padding:2px 6px;cursor:pointer;" onclick="setAll(${sIdx}, true)">全选</button>
          <button style="font-size:11px;padding:2px 6px;cursor:pointer;" onclick="setAll(${sIdx}, false)">全清</button>
        </div>
      </div>
      <div class="chip-container">
        ${chipsHtml}
      </div>
      <div class="add-flavor-row">
        <input type="text" class="add-flavor-input" id="new-flavor-${sIdx}" placeholder="输入新出的突发口味..." onkeydown="if(event.key==='Enter') addNewFlavor(${sIdx})">
        <button class="add-flavor-btn" onclick="addNewFlavor(${sIdx})">➕ 添加</button>
      </div>
    `;
    body.appendChild(group);
  });
}

// 切换某口味状态
function toggleFlavor(sIdx, fIdx) {
  shelves[sIdx].flavors[fIdx].active = !shelves[sIdx].flavors[fIdx].active;
  saveState();
  renderModal();
  renderPoster();
}

// 批量全选或全清
function setAll(sIdx, status) {
  shelves[sIdx].flavors.forEach(f => f.active = status);
  saveState();
  renderModal();
  renderPoster();
}

// 临时添加全新口味到库中
function addNewFlavor(sIdx) {
  const input = document.getElementById(`new-flavor-${sIdx}`);
  const val = input.value.trim();
  if (!val) return;
  shelves[sIdx].flavors.push({ name: val, active: true });
  input.value = '';
  saveState();
  renderModal();
  renderPoster();
}

// 弹窗开关
function openModal() {
  renderModal();
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

// 保存海报
function takeSnapshot() {
  const el = document.getElementById('poster-canvas');
  html2canvas(el, { scale: 3, useCORS: true }).then(canvas => {
    const link = document.createElement('a');
    link.download = '水果铺今日风味海报.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

// 页面启动首次渲染
renderPoster();
</script>
</body>
</html>
