<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千万别点这家水果铺 · 今日全量库存</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background-color: #ffd60a;
    background-image: radial-gradient(#ffc300 15%, transparent 16%);
    background-size: 16px 16px;
    padding: 16px;
    color: #111;
  }

  /* 顶部警示条 */
  .hazard-bar {
    height: 12px;
    background: repeating-linear-gradient(
      -45deg,
      #000,
      #000 12px,
      #ffd60a 12px,
      #ffd60a 24px
    );
    border: 2px solid #000;
    border-radius: 4px;
    margin-bottom: 12px;
  }

  /* 顶部招牌 */
  .header-card {
    background: #fff;
    border: 3px solid #000;
    border-radius: 12px;
    padding: 16px 12px;
    text-align: center;
    box-shadow: 5px 5px 0px #000;
    margin-bottom: 16px;
  }
  .badge-tag {
    display: inline-block;
    background: #e63946;
    color: #fff;
    font-size: 12px;
    font-weight: 900;
    padding: 3px 10px;
    border-radius: 20px;
    border: 2px solid #000;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .main-title {
    font-size: 24px;
    font-weight: 900;
    color: #000;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .sub-title {
    font-size: 13px;
    font-weight: 700;
    color: #d90429;
  }

  /* 操作工具栏 (截屏时自动隐藏) */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    background: #fff;
    border: 2px solid #000;
    padding: 10px 12px;
    border-radius: 8px;
    box-shadow: 3px 3px 0 #000;
  }
  .btn {
    background: #ffd60a;
    border: 2px solid #000;
    font-weight: 800;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 2px 2px 0 #000;
    transition: all 0.1s;
  }
  .btn:active {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0 #000;
  }
  .btn-shot {
    background: #e63946;
    color: #fff;
  }
  .btn-reset {
    background: #f1f1f1;
    color: #333;
  }

  /* 多列卡片容器 */
  .menu-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-start;
  }
  .category-box {
    background: #fff;
    border: 2.5px solid #000;
    border-radius: 8px;
    box-shadow: 4px 4px 0 #000;
    flex: 1 1 calc(50% - 12px);
    min-width: 140px;
    overflow: hidden;
  }
  @media (min-width: 768px) {
    .category-box {
      flex: 1 1 calc(25% - 12px);
      min-width: 160px;
    }
  }

  .cat-header {
    background: #000;
    color: #ffd60a;
    font-size: 14px;
    font-weight: 900;
    padding: 7px 10px;
    text-align: center;
    letter-spacing: 0.5px;
  }

  .item-list {
    list-style: none;
    padding: 6px 8px;
  }
  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 2px;
    font-size: 13px;
    border-bottom: 1px dashed #e5e5e5;
  }
  .item-row:last-child {
    border-bottom: none;
  }
  .item-left {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
    overflow: hidden;
  }
  .del-btn {
    display: inline-block;
    color: #e63946;
    font-size: 14px;
    cursor: pointer;
    font-weight: bold;
    padding: 0 4px;
    user-select: none;
  }
  .item-name {
    font-weight: 700;
    color: #222;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 状态按钮 */
  .status-badge {
    cursor: pointer;
    user-select: none;
    font-weight: 900;
    font-size: 12px;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1.5px solid #000;
    margin-left: 6px;
  }
  .status-has {
    background: #e63946;
    color: #fff;
  }
  .status-none {
    background: #e0e0e0;
    color: #888;
    border-color: #888;
    text-decoration: line-through;
  }

  /* 添加新口味输入栏 */
  .add-item-box {
    display: flex;
    gap: 4px;
    padding: 6px 8px;
    background: #fff8d6;
    border-top: 1.5px solid #000;
  }
  .add-input {
    flex: 1;
    border: 1.5px solid #000;
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 12px;
    outline: none;
  }
  .add-btn {
    background: #000;
    color: #ffd60a;
    border: none;
    font-weight: bold;
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
  }

  /* 底部提示 */
  .footer-card {
    margin-top: 16px;
    background: #fff;
    border: 3px solid #000;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    font-weight: 800;
    font-size: 13px;
    box-shadow: 4px 4px 0 #000;
  }

  /* 截屏模式隐藏操作控件 */
  body.screenshot-mode .toolbar,
  body.screenshot-mode .del-btn,
  body.screenshot-mode .add-item-box {
    display: none !important;
  }
  body.screenshot-mode {
    padding: 8px;
  }
</style>

// 本地存储初始化
let menuData = JSON.parse(localStorage.getItem('my_fruit_menu_data')) || defaultData;
let showDelete = false;

function saveData() {
  localStorage.setItem('my_fruit_menu_data', JSON.stringify(menuData));
}

// 渲染列表
function render() {
  const container = document.getElementById('menuGrid');
  container.innerHTML = '';

  menuData.forEach((cat, catIdx) => {
    const box = document.createElement('div');
    box.className = 'category-box';

    let itemsHtml = cat.items.map((it, itIdx) => `
      <li class="item-row">
        <div class="item-left">
          ${showDelete ? `<span class="del-btn" onclick="deleteItem(${catIdx},${itIdx})">✕</span>` : ''}
          <span class="item-name">${it.name}</span>
        </div>
        <span class="status-badge ${it.has ? 'status-has' : 'status-none'}" onclick="toggleStatus(${catIdx}, ${itIdx})">
          ${it.has ? '有' : '缺'}
        </span>
      </li>
    `).join('');

    box.innerHTML = `
      <div class="cat-header">${cat.category}</div>
      <ul class="item-list">${itemsHtml}</ul>
      <div class="add-item-box">
        <input type="text" class="add-input" id="input-${catIdx}" placeholder="加新口味..." onkeydown="handleEnter(event, ${catIdx})">
        <button class="add-btn" onclick="addItem(${catIdx})">➕</button>
      </div>
    `;
    container.appendChild(box);
  });
}

// 切换“有/缺”状态
function toggleStatus(catIdx, itIdx) {
  menuData[catIdx].items[itIdx].has = !menuData[catIdx].items[itIdx].has;
  saveData();
  render();
}

// 增加新口味
function addItem(catIdx) {
  const input = document.getElementById(`input-${catIdx}`);
  const val = input.value.trim();
  if (!val) return;
  menuData[catIdx].items.push({ name: val, has: true });
  input.value = '';
  saveData();
  render();
}

function handleEnter(e, catIdx) {
  if (e.key === 'Enter') addItem(catIdx);
}

// 减少/删除口味
function deleteItem(catIdx, itIdx) {
  menuData[catIdx].items.splice(itIdx, 1);
  saveData();
  render();
}

// 切换删除小红叉
function toggleEditIcons() {
  showDelete = !showDelete;
  render();
}

// 朋友圈截图模式（退出直接在任意空白处点两下）
function toggleScreenshotMode() {
  document.body.classList.toggle('screenshot-mode');
  if (document.body.classList.contains('screenshot-mode')) {
    alert("📸 已进入朋友圈截图模式！\n- 所有添加框和控制按钮已自动隐藏。\n- 此时可用手机直接截长图。\n- 双击屏幕任意位置即可退出截图模式。");
  }
}
document.addEventListener('dblclick', () => {
  if (document.body.classList.contains('screenshot-mode')) {
    document.body.classList.remove('screenshot-mode');
  }
});

// 重置默认
function resetToDefault() {
  if (confirm("确定要恢复到最初的预设菜单吗？")) {
    menuData = JSON.parse(JSON.stringify(defaultData));
    saveData();
    render();
  }
}
